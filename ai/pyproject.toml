[project]
name = "take-two-local-ai"
version = "0.1.0"
description = "Take Two Scene Studio local transcription and speaker diarization companion"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av>=14,<17",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
models = [
  "faster-whisper>=1.2,<2",
  "pyannote-audio>=4,<5",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.13,<1",
  "torch>=2,<3",
]
separation = [
  "bandit-infer>=0.1.0",
]
separation-fallback = [
  "demucs-infer==4.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/take_two_ai"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
bandit-infer = { git = "https://github.com/openmirlab/bandit-infer.git", rev = "d45cdec634bf1ee01cdd2acea74a2d100e639c8a" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv*", ".cache", ".tmp-pytest*"]

[tool.ruff.lint.per-file-ignores]
"src/take_two_ai/app.py" = ["B008"]
